<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castanaeta Joyería</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="/">
                <img src="{{ url_for('static', filename='img/logo.png') }}" class="nav-logo" alt="Castanaeta Logo">
            </a>
        </div>

        <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu" aria-expanded="false">
            <svg width="22" height="18" viewBox="0 0 22 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <line x1="0" y1="1" x2="22" y2="1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="0" y1="9" x2="22" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="0" y1="17" x2="22" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>

        <div class="nav-right">
            <a href="/">Home</a>
            <a href="/collection">Collection</a>
            <a href="/collection/rings">Rings</a>
            <a href="/collection/necklaces">Necklaces</a>
            <a href="/collection/earrings">Earrings</a>
            <a href="/collection/bracelets">Bracelets</a>
            <a href="/cart">Cart</a>

            <span class="nav-divider"></span>

            <a class="auth-link" href="{{ url_for('auth.login') }}">Login</a>
            <a class="auth-link" href="{{ url_for('auth.register') }}">Register</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© {{ current_year }} Castanaeta Joyería - All Rights Reserved</p>
    </footer>

    <!-- Floating buttons (same size, right side) -->
    <div class="floating-buttons">
        <a href="{{ url_for('cart') }}" class="fab fab-cart" aria-label="Cart">
            <img src="{{ url_for('static', filename='img/icons/cart.png') }}" alt="Cart">
            {% if cart_count and cart_count > 0 %}
                <span class="cart-badge">{{ cart_count }}</span>
            {% endif %}
        </a>

        <a href="https://wa.me/972546152494?text=Hello%2C%20I%20am%20interested%20in%20your%20jewelry"
           class="fab fab-whatsapp"
           target="_blank"
           aria-label="WhatsApp">
            <img src="{{ url_for('static', filename='img/whatsapp.png') }}" alt="WhatsApp">
        </a>
    </div>


    <script>
        (function () {
            var btn = document.getElementById('hamburger-btn');
            var nav = document.querySelector('.nav-right');
            if (!btn || !nav) return;
            btn.addEventListener('click', function () {
                var open = nav.classList.toggle('open');
                btn.setAttribute('aria-expanded', open);
            });
            document.addEventListener('click', function (e) {
                if (!e.target.closest('.navbar')) {
                    nav.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');
                }
            });
        })();
    </script>

</body>
</html>
