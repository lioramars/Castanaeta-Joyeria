{% extends "base.html" %}
{% block content %}

<div class="detail-wrapper">

    <!-- PRODUCT IMAGE -->
    <div class="detail-image-box">
        <img src="{{ url_for('static', filename=product.image) }}"
             class="detail-image"
             alt="{{ product.name }}">
    </div>

    <!-- PRODUCT INFO -->
    <div class="detail-info-box">
        <h1 class="detail-title">{{ product.name }}</h1>

        <p class="detail-price">{{ product.price }} ₪</p>

        <p class="detail-desc">{{ product.description }}</p>

        <!-- ACTIONS -->
        <div class="product-actions">

            <!-- ADD TO CART -->
            <button class="btn-primary-action" onclick="location.href='/add-to-cart/{{ product.id }}'">
                Add to Cart
            </button>

            <!-- WHATSAPP -->
            <a class="btn-secondary-action"
               href="https://wa.me/972546152494?text=Hello,%20I'm%20interested%20in%20{{ product.name }}"
               target="_blank" rel="noopener">
               Order on WhatsApp
            </a>

        </div>
    </div>

</div>

{% endblock %}
