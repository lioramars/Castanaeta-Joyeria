services:
  web:
    image: lior98/castanaeta-joyeria:latest
    container_name: castanaeta_app
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env

  nginx:
    image: nginx:latest
    container_name: castanaeta_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web
